server:
  port: ${PORT:8085}

spring:
  application:
    name: jobhunter-ai-backend-test
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobhunter_db}
    username: ${SPRING_DATASOURCE_USERNAME:jobhunter}
    password: ${SPRING_DATASOURCE_PASSWORD:jobhunter}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

security:
  jwt:
    # 256-bit test secret for isolated test runs
    secret-key: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

government:
  scheduler:
    # Explicitly disabled during test runs
    enabled: false

firecrawl:
  api-key: ${FIRECRAWL_API_KEY:}
  base-url: ${FIRECRAWL_BASE_URL:https://api.firecrawl.dev}

ai:
  provider: gemini
  embedding:
    provider: mock
  gemini:
    api-key: mock-key
    model-flash: gemini-3.5-flash
    model-pro: gemini-flash-latest
    model-embedding: gemini-embedding-001

storage:
  upload-dir: ./target/test-storage/resumes
