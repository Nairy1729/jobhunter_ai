server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: jobhunter-ai-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobhunter_db?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:jobhunter}
    password: ${SPRING_DATASOURCE_PASSWORD:jobhunter}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Security & JWT Configuration
security:
  jwt:
    # 256-bit secure default secret for development
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000     # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days

# Web Intelligence & AI Configuration
firecrawl:
  api-key: ${FIRECRAWL_API_KEY:}
  base-url: ${FIRECRAWL_BASE_URL:https://api.firecrawl.dev}

ai:
  provider: ${AI_PROVIDER:gemini}
  embedding:
    provider: ${AI_EMBEDDING_PROVIDER:auto}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model-flash: ${GEMINI_MODEL_FLASH:gemini-3.5-flash}
    model-pro: ${GEMINI_MODEL_PRO:gemini-flash-latest}
    model-embedding: ${GEMINI_MODEL_EMBEDDING:gemini-embedding-001}

# File Storage Configuration
storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:./storage/resumes}

# Resilience4j Configuration
resilience4j:
  ratelimiter:
    instances:
      firecrawl:
        limitForPeriod: 10
        limitRefreshPeriod: 60s
        timeoutDuration: 5s
  circuitbreaker:
    instances:
      firecrawl:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 5
  retry:
    instances:
      firecrawl:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.BadGateway
          - org.springframework.web.reactive.function.client.WebClientResponseException.ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException.GatewayTimeout
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.jobhunter.client.firecrawl.exception.FirecrawlRateLimitException
          - com.jobhunter.client.firecrawl.exception.FirecrawlClientException
          - com.jobhunter.client.firecrawl.exception.FirecrawlApiKeyMissingException
